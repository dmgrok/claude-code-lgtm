name: 'CC-Tricks Validator'
description: 'Lint Claude Code project configuration (.claude/ settings, hooks, commands) and SKILL.md files for spec and security issues'
author: 'CC-Tricks'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  path:
    description: 'Project directory to check (its .claude/ folder and SKILL.md files)'
    required: true
    default: '.'
  fail-on-error:
    description: 'Fail the action if any error-severity finding is reported'
    required: false
    default: 'true'
  lakera-api-key:
    description: 'Optional Lakera Guard API key. When set, SKILL.md content is also sent to Lakera Guard for ML-based prompt injection detection'
    required: false
    default: ''
  min-score:
    description: 'Deprecated and ignored. Checks are rule-based; use fail-on-error instead'
    required: false
    deprecationMessage: 'min-score is ignored: cc-tricks reports rule findings, not a numeric score. Use fail-on-error instead.'
  skip-duplicates:
    description: 'Deprecated and ignored. Registry duplicate checks were removed'
    required: false
    deprecationMessage: 'skip-duplicates is ignored: registry duplicate checks were removed.'

outputs:
  passed:
    description: 'Whether the check passed (true/false)'
  score:
    description: 'Compatibility output: 100 when the check passed, 0 otherwise'
  spec-compliance:
    description: 'Number of SKILL.md spec findings (skills/spec)'
  security:
    description: 'Number of SKILL.md security findings (skills/security)'
  results-file:
    description: 'Path to the JSON results file (lgtm-results.json) for artifact upload'

runs:
  using: 'node24'
  main: 'dist/action.cjs'
